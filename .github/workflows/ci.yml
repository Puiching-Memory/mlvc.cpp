name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  model-tools:
    name: checkpoint AOT and bundle host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline compiler test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy protobuf==6.33.5
      - name: Test graph capture, lowering, and bundle integrity
        run: |
          python tests/unit/aot_tests.py
          python tests/unit/model_package_tests.py

  cpu-matrix:
    name: CPU backend + SDK consumer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - label: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - label: macos-arm64
            os: macos-15
            cc: clang
            cxx: clang++
          - label: windows-msvc
            os: windows-latest
            cc: ""
            cxx: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure, build, test, and verify installed CMake consumer (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/cpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLVC_BACKEND=cpu \
            -DMLVC_EMBED_MODELS=OFF \
            -DMLVC_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/cpu --parallel 4
          ctest --test-dir build/cpu --output-on-failure
          cmake --install build/cpu --prefix "$PWD/install/cpu"
          cmake -S tests/integration/cmake_consumer -B build/consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install/cpu"
          cmake --build build/consumer --parallel 2
          ./build/consumer/mlvc_installed_consumer

      - name: Configure, build, test, and verify installed CMake consumer (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/cpu `
            -DMLVC_BACKEND=cpu `
            -DMLVC_EMBED_MODELS=OFF `
            -DMLVC_WARNINGS_AS_ERRORS=ON `
            -DBUILD_TESTING=ON
          cmake --build build/cpu --config Release --parallel 4
          ctest --test-dir build/cpu -C Release --output-on-failure
          cmake --install build/cpu --config Release --prefix "$PWD/install/cpu"
          cmake -S tests/integration/cmake_consumer -B build/consumer `
            -DCMAKE_PREFIX_PATH="$PWD/install/cpu"
          cmake --build build/consumer --config Release --parallel 2
          $env:PATH = "$PWD/install/cpu/bin;$env:PATH"
          .\build\consumer\Release\mlvc_installed_consumer.exe

  sanitizers:
    name: Host sanitizers (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: asan-ubsan
            preset: cpu-sanitize
          - mode: tsan
            preset: cpu-tsan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and run sanitizer test suite
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel 4
          ctest --preset ${{ matrix.preset }}

  package:
    name: driver-cubin build, test, and package (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install CUDA compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates clang curl python3-venv
          python3 -m venv build/proto-tools
          build/proto-tools/bin/pip install -r tools/python/requirements-proto.txt
          echo "$PWD/build/proto-tools/bin" >> "$GITHUB_PATH"
          source tools/scripts/dependencies.env
          cuda_pkg="cuda-toolkit-${MLVC_CUDA_VERSION//./-}"
          curl --fail --location --retry 3 --output /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y "$cuda_pkg"
          echo "/usr/local/cuda-${MLVC_CUDA_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build, test, and create CI package
        run: |
          ./tools/scripts/package.sh --jobs 2 \
            --build-root "build/ci-${{ matrix.compiler }}" \
            --output-dir "packages/${{ matrix.compiler }}" \
            --skip-gpu-tests --skip-models

      - name: Run driver-cubin host sanitizer tests
        if: matrix.compiler == 'gcc'
        run: |
          cmake --preset driver-cubin-sanitize
          cmake --build --preset driver-cubin-sanitize --parallel 2
          ctest --preset driver-cubin-sanitize

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlvc-cpp-driver-cubin-ci-${{ matrix.compiler }}
          path: packages/${{ matrix.compiler }}/*-ci.tar.gz
          if-no-files-found: error

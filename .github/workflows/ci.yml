name: NVIDIA release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    name: ${{ matrix.backend }}
    runs-on: [self-hosted, linux, x64, nvidia]
    strategy:
      fail-fast: false
      matrix:
        backend: [onnxruntime, libtorch, tensorrt]

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap.sh --backend "${{ matrix.backend }}"

      - name: Build and audit release
        run: ./scripts/package.sh --backend "${{ matrix.backend }}" --jobs 2

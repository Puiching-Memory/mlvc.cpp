name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: build, test, and package (${{ matrix.compiler }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install CUDA compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates clang curl
          curl --fail --location --retry 3 --output /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-13-3
          echo "/usr/local/cuda-13.3/bin" >> "$GITHUB_PATH"

      - name: Build, test, and create CI package
        run: |
          ./tools/package.sh --backend driver-cubin --jobs 2 \
            --build-root "build/ci-${{ matrix.compiler }}" \
            --output-dir "packages/${{ matrix.compiler }}" \
            --skip-gpu-tests --skip-models

      - name: Run host sanitizer tests
        if: matrix.compiler == 'gcc'
        run: |
          cmake --preset driver-cubin-sanitize
          cmake --build --preset driver-cubin-sanitize --parallel 2
          ctest --preset driver-cubin-sanitize

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlvc-cpp-driver-cubin-ci-${{ matrix.compiler }}
          path: packages/${{ matrix.compiler }}/*-ci.tar.gz
          if-no-files-found: error

  framework-backends-compile:
    # The package job only builds driver-cubin, so global warning policy
    # changes (-Wall/-Wextra/-Wshadow/-Werror) are never exercised against
    # the ONNX Runtime, libtorch, and TensorRT SDKs.  Compile all three
    # framework backends to catch regressions that a driver-cubin-only CI
    # cannot see.  Model bundles are gitignored, so this is a compile-only
    # job; it does not run tests or produce archives.
    name: compile framework backends under -Werror
    runs-on: ubuntu-26.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache pinned GPU SDKs
        uses: actions/cache@v4
        with:
          path: |
            third_party/onnxruntime
            third_party/libtorch
          key: mlvc-sdks-${{ hashFiles('tools/dependencies.env') }}

      - name: Bootstrap CUDA toolkit and pinned GPU SDKs
        run: ./tools/bootstrap.sh --backend all

      - name: Compile onnxruntime backend
        run: |
          cmake -S . -B build/ci-onnxruntime -DCMAKE_BUILD_TYPE=Release \
            -DMLVC_SELECTED_BACKEND=onnxruntime \
            -DMLVC_TEST_ASSETS_DIR="$PWD/models/fixtures" \
            -DMLVC_ENABLE_IPO=ON -DMLVC_WARNINGS_AS_ERRORS=ON \
            -DONNXRUNTIME_ROOT="$PWD/third_party/onnxruntime/onnxruntime-linux-x64-gpu-1.26.0"
          cmake --build build/ci-onnxruntime --parallel 2

      - name: Compile libtorch backend
        run: |
          cmake -S . -B build/ci-libtorch -DCMAKE_BUILD_TYPE=Release \
            -DMLVC_SELECTED_BACKEND=libtorch \
            -DMLVC_TEST_ASSETS_DIR="$PWD/models/fixtures" \
            -DMLVC_ENABLE_IPO=ON -DMLVC_WARNINGS_AS_ERRORS=ON \
            -DLIBTORCH_ROOT="$PWD/third_party/libtorch/2.13.0-cu130/libtorch"
          cmake --build build/ci-libtorch --parallel 2

      - name: Compile tensorrt backend
        run: |
          cmake -S . -B build/ci-tensorrt -DCMAKE_BUILD_TYPE=Release \
            -DMLVC_SELECTED_BACKEND=tensorrt \
            -DMLVC_TEST_ASSETS_DIR="$PWD/models/fixtures" \
            -DMLVC_ENABLE_IPO=ON -DMLVC_WARNINGS_AS_ERRORS=ON
          cmake --build build/ci-tensorrt --parallel 2

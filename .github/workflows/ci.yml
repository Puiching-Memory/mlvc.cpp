name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  model-tools:
    name: checkpoint AOT and bundle host tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline compiler test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy protobuf==6.33.5
      - name: Test graph capture, lowering, and bundle integrity
        run: |
          python tests/unit/aot_tests.py
          python tests/unit/model_package_tests.py

  package:
    name: build, test, and package (${{ matrix.compiler }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install CUDA compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates clang curl python3-venv
          python3 -m venv build/proto-tools
          build/proto-tools/bin/pip install protobuf==6.33.5
          echo "$PWD/build/proto-tools/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 --output /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-13-3
          echo "/usr/local/cuda-13.3/bin" >> "$GITHUB_PATH"
          # Driverless runners have only the unversioned stub (SONAME
          # libcuda.so.1); alias it so links resolve the codec's transitive
          # DT_NEEDED libcuda.so.1 against the toolkit stub.
          sudo ln -sf libcuda.so /usr/local/cuda-13.3/lib64/stubs/libcuda.so.1
          sudo ln -sf libcuda.so /usr/local/cuda-13.3/targets/x86_64-linux/lib/stubs/libcuda.so.1

      - name: Build, test, and create CI package
        run: |
          ./tools/package.sh --jobs 2 \
            --build-root "build/ci-${{ matrix.compiler }}" \
            --output-dir "packages/${{ matrix.compiler }}" \
            --skip-gpu-tests --skip-models

      - name: Run host sanitizer tests
        if: matrix.compiler == 'gcc'
        run: |
          cmake --preset driver-cubin-sanitize
          cmake --build --preset driver-cubin-sanitize --parallel 2
          ctest --preset driver-cubin-sanitize

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlvc-cpp-driver-cubin-ci-${{ matrix.compiler }}
          path: packages/${{ matrix.compiler }}/*-ci.tar.gz
          if-no-files-found: error

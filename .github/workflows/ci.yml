name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: build, test, and package
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install CUDA compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          curl --fail --location --retry 3 --output /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-13-3
          echo "/usr/local/cuda-13.3/bin" >> "$GITHUB_PATH"

      - name: Build, test, and create CI package
        run: ./tools/package.sh --backend driver-cubin --jobs 2 --skip-gpu-tests --skip-models

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlvc-cpp-driver-cubin-ci
          path: packages/*-ci.tar.gz
          if-no-files-found: error

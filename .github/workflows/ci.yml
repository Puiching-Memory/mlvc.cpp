name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ curl

      - name: Fetch ONNX Runtime (CPU)
        run: bash scripts/fetch_onnxruntime.sh

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DONNXRUNTIME_ROOT="$PWD/third_party/onnxruntime/onnxruntime-linux-x64-1.19.2"

      - name: Build
        run: cmake --build build

      - name: Smoke test
        run: ./build/mlvc_demo
